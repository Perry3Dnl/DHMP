services:
  dhmp-demo:
    build:
      context: ../..
      dockerfile: samples/DHMP.FramebufferDemo/Dockerfile
    container_name: dhmp-demo
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DHMP_DEMO_COMMIT: ${DHMP_DEMO_COMMIT:-dev}
    ports:
      - "127.0.0.1:8091:8080"
    networks:
      - default
      - shared_proxy

networks:
  shared_proxy:
    external: true
    name: ${SHARED_PROXY_NETWORK:-dummy-stock-simulator_default}
