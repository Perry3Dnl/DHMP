<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1072" viewBox="0 0 1650 1072">
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#53627a}.label{font-size:17px}.value{font-size:16px;font-weight:700}.tick{font-size:14px;fill:#667085}.note{font-size:16px;fill:#667085}</style>
<text x="825" y="48" text-anchor="middle" class="title">Fair v6 — one 32-byte logical message per framing unit</text>
<text x="825" y="80" text-anchor="middle" class="sub">Fresh 5-run loopback rerun · same TCP settings / RX size / publication path · bars are medians, whiskers min–max</text><line x1="520" y1="130" x2="520" y2="950" stroke="#e3e8ef"/><text x="520" y="976" text-anchor="middle" class="tick">0</text><line x1="720" y1="130" x2="720" y2="950" stroke="#e3e8ef"/><text x="720" y="976" text-anchor="middle" class="tick">32</text><line x1="920" y1="130" x2="920" y2="950" stroke="#e3e8ef"/><text x="920" y="976" text-anchor="middle" class="tick">64</text><line x1="1120" y1="130" x2="1120" y2="950" stroke="#e3e8ef"/><text x="1120" y="976" text-anchor="middle" class="tick">96</text><line x1="1320" y1="130" x2="1320" y2="950" stroke="#e3e8ef"/><text x="1320" y="976" text-anchor="middle" class="tick">128</text><line x1="1520" y1="130" x2="1520" y2="950" stroke="#e3e8ef"/><text x="1520" y="976" text-anchor="middle" class="tick">160</text><text x="502" y="177" text-anchor="end" class="label">DHMP fixed contract</text><rect x="520" y="154" width="848.6" height="38" rx="5" fill="#1677ff" opacity="0.92"/><line x1="1281.0" y1="200" x2="1442.4" y2="200" stroke="#26364f" stroke-width="2"/><line x1="1281.0" y1="194" x2="1281.0" y2="206" stroke="#26364f" stroke-width="2"/><line x1="1442.4" y1="194" x2="1442.4" y2="206" stroke="#26364f" stroke-width="2"/><text x="1380.6" y="179" class="value">135.8 M/s</text><text x="502" y="249" text-anchor="end" class="label">Raw TCP / fixed32</text><rect x="520" y="226" width="886.9" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="862.1" y1="272" x2="1455.2" y2="272" stroke="#26364f" stroke-width="2"/><line x1="862.1" y1="266" x2="862.1" y2="278" stroke="#26364f" stroke-width="2"/><line x1="1455.2" y1="266" x2="1455.2" y2="278" stroke="#26364f" stroke-width="2"/><text x="1418.9" y="251" class="value">141.9 M/s</text><text x="502" y="321" text-anchor="end" class="label">TCP / varint length</text><rect x="520" y="298" width="673.3" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="919.3" y1="344" x2="1369.3" y2="344" stroke="#26364f" stroke-width="2"/><line x1="919.3" y1="338" x2="919.3" y2="350" stroke="#26364f" stroke-width="2"/><line x1="1369.3" y1="338" x2="1369.3" y2="350" stroke="#26364f" stroke-width="2"/><text x="1205.3" y="323" class="value">107.7 M/s</text><text x="502" y="393" text-anchor="end" class="label">TCP / 4-byte length</text><rect x="520" y="370" width="770.3" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="924.5" y1="416" x2="1350.3" y2="416" stroke="#26364f" stroke-width="2"/><line x1="924.5" y1="410" x2="924.5" y2="422" stroke="#26364f" stroke-width="2"/><line x1="1350.3" y1="410" x2="1350.3" y2="422" stroke="#26364f" stroke-width="2"/><text x="1302.3" y="395" class="value">123.2 M/s</text><text x="502" y="465" text-anchor="end" class="label">WebSocket / 32 B binary frame</text><rect x="520" y="442" width="546.9" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="1017.4" y1="488" x2="1391.3" y2="488" stroke="#26364f" stroke-width="2"/><line x1="1017.4" y1="482" x2="1017.4" y2="494" stroke="#26364f" stroke-width="2"/><line x1="1391.3" y1="482" x2="1391.3" y2="494" stroke="#26364f" stroke-width="2"/><text x="1078.9" y="467" class="value">87.5 M/s</text><text x="502" y="537" text-anchor="end" class="label">HTTP/1.1 / 32 B chunk</text><rect x="520" y="514" width="439.0" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="780.1" y1="560" x2="1038.0" y2="560" stroke="#26364f" stroke-width="2"/><line x1="780.1" y1="554" x2="780.1" y2="566" stroke="#26364f" stroke-width="2"/><line x1="1038.0" y1="554" x2="1038.0" y2="566" stroke="#26364f" stroke-width="2"/><text x="971.0" y="539" class="value">70.2 M/s</text><text x="502" y="609" text-anchor="end" class="label">HTTP/2 / 32 B DATA frame</text><rect x="520" y="586" width="428.9" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="801.9" y1="632" x2="1264.0" y2="632" stroke="#26364f" stroke-width="2"/><line x1="801.9" y1="626" x2="801.9" y2="638" stroke="#26364f" stroke-width="2"/><line x1="1264.0" y1="626" x2="1264.0" y2="638" stroke="#26364f" stroke-width="2"/><text x="960.9" y="611" class="value">68.6 M/s</text><text x="502" y="681" text-anchor="end" class="label">gRPC / 32 B message + DATA</text><rect x="520" y="658" width="459.9" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="765.1" y1="704" x2="1035.0" y2="704" stroke="#26364f" stroke-width="2"/><line x1="765.1" y1="698" x2="765.1" y2="710" stroke="#26364f" stroke-width="2"/><line x1="1035.0" y1="698" x2="1035.0" y2="710" stroke="#26364f" stroke-width="2"/><text x="991.9" y="683" class="value">73.6 M/s</text><text x="502" y="753" text-anchor="end" class="label">MQTT QoS0 / 32 B PUBLISH</text><rect x="520" y="730" width="497.5" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="795.5" y1="776" x2="1099.2" y2="776" stroke="#26364f" stroke-width="2"/><line x1="795.5" y1="770" x2="795.5" y2="782" stroke="#26364f" stroke-width="2"/><line x1="1099.2" y1="770" x2="1099.2" y2="782" stroke="#26364f" stroke-width="2"/><text x="1029.5" y="755" class="value">79.6 M/s</text><text x="502" y="825" text-anchor="end" class="label">NATS / 32 B PUB</text><rect x="520" y="802" width="289.2" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="743.3" y1="848" x2="816.3" y2="848" stroke="#26364f" stroke-width="2"/><line x1="743.3" y1="842" x2="743.3" y2="854" stroke="#26364f" stroke-width="2"/><line x1="816.3" y1="842" x2="816.3" y2="854" stroke="#26364f" stroke-width="2"/><text x="821.2" y="827" class="value">46.3 M/s</text><text x="502" y="897" text-anchor="end" class="label">UDP / 32 B datagram (reference)</text><rect x="520" y="874" width="4.1" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="523.0" y1="920" x2="524.9" y2="920" stroke="#26364f" stroke-width="2"/><line x1="523.0" y1="914" x2="523.0" y2="926" stroke="#26364f" stroke-width="2"/><line x1="524.9" y1="914" x2="524.9" y2="926" stroke="#26364f" stroke-width="2"/><text x="536.1" y="899" class="value">0.7 M/s</text><text x="1020" y="1007" text-anchor="middle" class="sub">Million validated logical messages per second</text><text x="1020" y="1035" text-anchor="middle" class="note">Shared KVM localhost is noisy; raw TCP and DHMP overlap heavily. UDP is a non-equivalent datagram reference.</text><text x="1020" y="1057" text-anchor="middle" class="note">Native framing kernels only — not complete HTTP/gRPC/MQTT/NATS production stacks.</text></svg>