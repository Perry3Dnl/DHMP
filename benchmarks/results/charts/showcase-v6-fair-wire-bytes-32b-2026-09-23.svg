<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="990" viewBox="0 0 1650 990">
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#53627a}.label{font-size:17px}.value{font-size:16px;font-weight:700}.tick{font-size:14px;fill:#667085}.note{font-size:16px;fill:#667085}</style>
<text x="825" y="48" text-anchor="middle" class="title">Fair v6 — application/framing bytes per 32-byte logical message</text>
<text x="825" y="80" text-anchor="middle" class="sub">One logical message per framing unit · lower overhead is better</text><line x1="520" y1="130" x2="520" y2="878" stroke="#e3e8ef"/><text x="520" y="904" text-anchor="middle" class="tick">0</text><line x1="722" y1="130" x2="722" y2="878" stroke="#e3e8ef"/><text x="722" y="904" text-anchor="middle" class="tick">10</text><line x1="924" y1="130" x2="924" y2="878" stroke="#e3e8ef"/><text x="924" y="904" text-anchor="middle" class="tick">20</text><line x1="1126" y1="130" x2="1126" y2="878" stroke="#e3e8ef"/><text x="1126" y="904" text-anchor="middle" class="tick">30</text><line x1="1328" y1="130" x2="1328" y2="878" stroke="#e3e8ef"/><text x="1328" y="904" text-anchor="middle" class="tick">40</text><line x1="1530" y1="130" x2="1530" y2="878" stroke="#e3e8ef"/><text x="1530" y="904" text-anchor="middle" class="tick">50</text><text x="502" y="179" text-anchor="end" class="label">DHMP fixed contract</text><rect x="520" y="154" width="96.7" height="40" rx="5" fill="#1677ff" opacity="0.92"/><text x="628.7" y="180" class="value">5 B</text><text x="502" y="251" text-anchor="end" class="label">Raw TCP / fixed32</text><rect x="520" y="226" width="115.8" height="40" rx="5" fill="#758196" opacity="0.92"/><text x="647.8" y="252" class="value">6 B</text><text x="502" y="323" text-anchor="end" class="label">TCP / varint length</text><rect x="520" y="298" width="180.0" height="40" rx="5" fill="#758196" opacity="0.92"/><text x="712.0" y="324" class="value">9 B</text><text x="502" y="395" text-anchor="end" class="label">TCP / 4-byte length</text><rect x="520" y="370" width="125.1" height="40" rx="5" fill="#758196" opacity="0.92"/><text x="657.1" y="396" class="value">6 B</text><text x="502" y="467" text-anchor="end" class="label">WebSocket / 32 B binary frame</text><rect x="520" y="442" width="152.1" height="40" rx="5" fill="#758196" opacity="0.92"/><text x="684.1" y="468" class="value">8 B</text><text x="502" y="539" text-anchor="end" class="label">HTTP/1.1 / 32 B chunk</text><rect x="520" y="514" width="271.0" height="40" rx="5" fill="#758196" opacity="0.92"/><text x="803.0" y="540" class="value">13 B</text><text x="502" y="611" text-anchor="end" class="label">HTTP/2 / 32 B DATA frame</text><rect x="520" y="586" width="260.6" height="40" rx="5" fill="#758196" opacity="0.92"/><text x="792.6" y="612" class="value">13 B</text><text x="502" y="683" text-anchor="end" class="label">gRPC / 32 B message + DATA</text><rect x="520" y="658" width="238.4" height="40" rx="5" fill="#758196" opacity="0.92"/><text x="770.4" y="684" class="value">12 B</text><text x="502" y="755" text-anchor="end" class="label">MQTT QoS0 / 32 B PUBLISH</text><rect x="520" y="730" width="207.1" height="40" rx="5" fill="#758196" opacity="0.92"/><text x="739.1" y="756" class="value">10 B</text><text x="502" y="827" text-anchor="end" class="label">NATS / 32 B PUB</text><rect x="520" y="802" width="449.5" height="40" rx="5" fill="#758196" opacity="0.92"/><text x="981.5" y="828" class="value">22 B</text><text x="1025" y="935" text-anchor="middle" class="sub">Application/framing bytes represented by each 32-byte logical message</text><text x="1025" y="965" text-anchor="middle" class="note">Excludes Ethernet/IP/TCP headers; this is the benchmark's application/framing byte stream.</text></svg>