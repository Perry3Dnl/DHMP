<line x1="700.0" y1="115" x2="700.0" y2="630" stroke="#e3e8ef"/><text x="700.0" y="656" text-anchor="middle" class="tick">40.0k</text>
<line x1="870.0" y1="115" x2="870.0" y2="630" stroke="#e3e8ef"/><text x="870.0" y="656" text-anchor="middle" class="tick">60.0k</text>
<line x1="1040.0" y1="115" x2="1040.0" y2="630" stroke="#e3e8ef"/><text x="1040.0" y="656" text-anchor="middle" class="tick">80.0k</text>
<line x1="1210.0" y1="115" x2="1210.0" y2="630" stroke="#e3e8ef"/><text x="1210.0" y="656" text-anchor="middle" class="tick">100.0k</text>
<text x="342" y="155.0" text-anchor="end" class="label">DHMP Latest / Ring-3 v3</text><rect x="360" y="125" width="626.2" height="46" rx="5" fill="#1677ff"/><text x="996.2" y="155.0" text-anchor="start" class="value">73.7k</text>
<text x="342" y="223.0" text-anchor="end" class="label">DHMPS / TLS 1.3 / Ring-3</text><rect x="360" y="193" width="703.6" height="46" rx="5" fill="#60a5fa"/><text x="1073.6" y="223.0" text-anchor="start" class="value">82.8k</text>
<text x="342" y="291.0" text-anchor="end" class="label">Raw TCP / fixed frame</text><rect x="360" y="261" width="684.6" height="46" rx="5" fill="#5b6470"/><text x="1054.6" y="291.0" text-anchor="start" class="value">80.5k</text>
