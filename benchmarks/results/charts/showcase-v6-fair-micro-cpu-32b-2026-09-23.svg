<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#53627a}.label{font-size:17px}.value{font-size:16px;font-weight:700}.tick{font-size:14px;fill:#667085}.note{font-size:16px;fill:#667085}</style>
<text x="825" y="48" text-anchor="middle" class="title">Fair v6 — framing-kernel CPU cost</text>
<text x="825" y="80" text-anchor="middle" class="sub">Processor-only cross-check · 5 × 50 million validated messages · same audited source · lower is better</text><line x1="520" y1="130" x2="520" y2="878" stroke="#e3e8ef"/><text x="520" y="904" text-anchor="middle" class="tick">0.0</text><line x1="722" y1="130" x2="722" y2="878" stroke="#e3e8ef"/><text x="722" y="904" text-anchor="middle" class="tick">2.4</text><line x1="924" y1="130" x2="924" y2="878" stroke="#e3e8ef"/><text x="924" y="904" text-anchor="middle" class="tick">4.8</text><line x1="1126" y1="130" x2="1126" y2="878" stroke="#e3e8ef"/><text x="1126" y="904" text-anchor="middle" class="tick">7.2</text><line x1="1328" y1="130" x2="1328" y2="878" stroke="#e3e8ef"/><text x="1328" y="904" text-anchor="middle" class="tick">9.6</text><line x1="1530" y1="130" x2="1530" y2="878" stroke="#e3e8ef"/><text x="1530" y="904" text-anchor="middle" class="tick">12.0</text><text x="502" y="177" text-anchor="end" class="label">DHMP fixed contract</text><rect x="520" y="154" width="147.1" height="38" rx="5" fill="#1677ff" opacity="0.92"/><line x1="644.6" y1="200" x2="674.7" y2="200" stroke="#26364f" stroke-width="2"/><line x1="644.6" y1="194" x2="644.6" y2="206" stroke="#26364f" stroke-width="2"/><line x1="674.7" y1="194" x2="674.7" y2="206" stroke="#26364f" stroke-width="2"/><text x="679.1" y="179" class="value">1.748 ns</text><text x="502" y="249" text-anchor="end" class="label">Raw TCP / fixed32</text><rect x="520" y="226" width="133.3" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="646.6" y1="272" x2="663.8" y2="272" stroke="#26364f" stroke-width="2"/><line x1="646.6" y1="266" x2="646.6" y2="278" stroke="#26364f" stroke-width="2"/><line x1="663.8" y1="266" x2="663.8" y2="278" stroke="#26364f" stroke-width="2"/><text x="665.3" y="251" class="value">1.584 ns</text><text x="502" y="321" text-anchor="end" class="label">TCP / varint length</text><rect x="520" y="298" width="212.9" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="728.4" y1="344" x2="744.7" y2="344" stroke="#26364f" stroke-width="2"/><line x1="728.4" y1="338" x2="728.4" y2="350" stroke="#26364f" stroke-width="2"/><line x1="744.7" y1="338" x2="744.7" y2="350" stroke="#26364f" stroke-width="2"/><text x="744.9" y="323" class="value">2.529 ns</text><text x="502" y="393" text-anchor="end" class="label">TCP / 4-byte length</text><rect x="520" y="370" width="179.7" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="691.7" y1="416" x2="708.3" y2="416" stroke="#26364f" stroke-width="2"/><line x1="691.7" y1="410" x2="691.7" y2="422" stroke="#26364f" stroke-width="2"/><line x1="708.3" y1="410" x2="708.3" y2="422" stroke="#26364f" stroke-width="2"/><text x="711.7" y="395" class="value">2.135 ns</text><text x="502" y="465" text-anchor="end" class="label">WebSocket / 32 B binary frame</text><rect x="520" y="442" width="247.8" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="754.2" y1="488" x2="785.8" y2="488" stroke="#26364f" stroke-width="2"/><line x1="754.2" y1="482" x2="754.2" y2="494" stroke="#26364f" stroke-width="2"/><line x1="785.8" y1="482" x2="785.8" y2="494" stroke="#26364f" stroke-width="2"/><text x="779.8" y="467" class="value">2.944 ns</text><text x="502" y="537" text-anchor="end" class="label">HTTP/1.1 / 32 B chunk</text><rect x="520" y="514" width="563.2" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="1071.5" y1="560" x2="1132.7" y2="560" stroke="#26364f" stroke-width="2"/><line x1="1071.5" y1="554" x2="1071.5" y2="566" stroke="#26364f" stroke-width="2"/><line x1="1132.7" y1="554" x2="1132.7" y2="566" stroke="#26364f" stroke-width="2"/><text x="1095.2" y="539" class="value">6.691 ns</text><text x="502" y="609" text-anchor="end" class="label">HTTP/2 / 32 B DATA frame</text><rect x="520" y="586" width="384.3" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="887.5" y1="632" x2="912.1" y2="632" stroke="#26364f" stroke-width="2"/><line x1="887.5" y1="626" x2="887.5" y2="638" stroke="#26364f" stroke-width="2"/><line x1="912.1" y1="626" x2="912.1" y2="638" stroke="#26364f" stroke-width="2"/><text x="916.3" y="611" class="value">4.566 ns</text><text x="502" y="681" text-anchor="end" class="label">gRPC / 32 B message + DATA</text><rect x="520" y="658" width="371.0" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="877.0" y1="704" x2="928.5" y2="704" stroke="#26364f" stroke-width="2"/><line x1="877.0" y1="698" x2="877.0" y2="710" stroke="#26364f" stroke-width="2"/><line x1="928.5" y1="698" x2="928.5" y2="710" stroke="#26364f" stroke-width="2"/><text x="903.0" y="683" class="value">4.408 ns</text><text x="502" y="753" text-anchor="end" class="label">MQTT QoS0 / 32 B PUBLISH</text><rect x="520" y="730" width="288.7" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="799.8" y1="776" x2="829.8" y2="776" stroke="#26364f" stroke-width="2"/><line x1="799.8" y1="770" x2="799.8" y2="782" stroke="#26364f" stroke-width="2"/><line x1="829.8" y1="770" x2="829.8" y2="782" stroke="#26364f" stroke-width="2"/><text x="820.7" y="755" class="value">3.430 ns</text><text x="502" y="825" text-anchor="end" class="label">NATS / 32 B PUB</text><rect x="520" y="802" width="848.1" height="38" rx="5" fill="#758196" opacity="0.92"/><line x1="1356.4" y1="848" x2="1431.2" y2="848" stroke="#26364f" stroke-width="2"/><line x1="1356.4" y1="842" x2="1356.4" y2="854" stroke="#26364f" stroke-width="2"/><line x1="1431.2" y1="842" x2="1431.2" y2="854" stroke="#26364f" stroke-width="2"/><text x="1380.1" y="827" class="value">10.076 ns</text><text x="1025" y="935" text-anchor="middle" class="sub">CPU nanoseconds per validated logical message · lower is better</text><text x="1025" y="963" text-anchor="middle" class="note">Raw fixed TCP is faster than DHMP here, as expected; DHMP adds a small ownership publication step.</text><text x="1025" y="985" text-anchor="middle" class="note">This isolates framing work and is not network throughput.</text></svg>