name: DHMP Stable .NET Benchmark V1
on:
  workflow_dispatch:
    inputs:
      profile:
        required: true
        default: quick
        type: choice
        options: [quick, full]
  push:
    branches: [main]
    paths:
      - 'src/Dhmp.Server/**'
      - 'src/Dhmp.Protocol/**'
      - 'benchmarks/dotnet-max-throughput/**'
      - 'benchmarks/dotnet-hotpath-cost/**'
      - '.github/workflows/dotnet-max-throughput.yml'
permissions: { contents: read }
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build once
        run: dotnet build benchmarks/dotnet-max-throughput/Dhmp.MaxThroughputDemo.csproj -c Release
      - name: Build hot-path diagnostic
        run: dotnet build benchmarks/dotnet-hotpath-cost/Dhmp.HotPathCost.csproj -c Release
      - name: Stable benchmark V1
        shell: bash
        run: |
          set -euo pipefail
          echo "BENCHMARK_CONTRACT=V1 -- DO NOT CHANGE workloads/layout/slab/chunk-pattern when comparing optimization commits"
          echo "COMMIT=${GITHUB_SHA}"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          dotnet --info | sed -n '1,40p'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.profile }}" == "full" ]]; then N=10000000; PASSES=20; RUNS=7; else N=5000000; PASSES=5; RUNS=3; fi
          DLL=benchmarks/dotnet-max-throughput/bin/Release/net10.0/Dhmp.MaxThroughputDemo.dll
          for ((i=1;i<=RUNS;i++)); do echo "===== V1 RUN $i / $RUNS ====="; dotnet "$DLL" "$N" "$PASSES"; done
      - name: Managed hot-path cost diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "DIAGNOSTIC_CONTRACT=HOTPATH_COST_V1 -- V1 benchmark above remains unchanged"
          DLL=benchmarks/dotnet-hotpath-cost/bin/Release/net10.0/Dhmp.HotPathCost.dll
          for i in 1 2 3; do echo "===== HOTPATH RUN $i / 3 ====="; dotnet "$DLL" 5000000 5; done
