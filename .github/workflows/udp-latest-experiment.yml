name: DHMP UDP Latest Experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/udp-latest-experiment/**'
      - '.github/workflows/udp-latest-experiment.yml'
permissions: { contents: read }
jobs:
  udp-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Environment
        shell: bash
        run: |
          echo "COMMIT=${GITHUB_SHA}"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          dotnet --info | sed -n '1,40p'
      - name: Build
        run: dotnet build benchmarks/udp-latest-experiment/Dhmp.UdpLatestExperiment.csproj -c Release
      - name: Raw UDP versus experimental DHMP UDP Latest
        shell: bash
        run: |
          set -euo pipefail
          echo "UDP_EXPERIMENT_CONTRACT=V2 -- concurrent sender/receiver; one 32-byte logical message per datagram; bounded drain"
          DLL=benchmarks/udp-latest-experiment/bin/Release/net10.0/Dhmp.UdpLatestExperiment.dll
          for i in 1 2 3 4 5; do
            echo "===== UDP EXPERIMENT RUN $i / 5 ====="
            dotnet "$DLL" 5000000
          done
