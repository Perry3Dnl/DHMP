name: Fixed stream carry A/B

on:
  push:
    branches: [main]
    paths:
      - 'src/Dhmp.Server/DHMPFixedStreamProcessor.cs'
      - 'benchmarks/dotnet-receive-boundary-bench/**'
      - 'benchmarks/dotnet-receive-boundary-tests/**'
      - 'benchmarks/summarize_carry_ab.py'
      - '.github/workflows/fixed-stream-carry-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_TieredCompilation: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare identical harness with previous processor
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/dhmp-carry-baseline"
          mkdir -p "$baseline_dir/benchmarks"
          cp -R src "$baseline_dir/src"
          cp -R benchmarks/dotnet-receive-boundary-bench "$baseline_dir/benchmarks/"
          cp -R benchmarks/dotnet-receive-boundary-tests "$baseline_dir/benchmarks/"
          git show 213e39825174384b5c92c80066b63164231949dd:src/Dhmp.Server/DHMPFixedStreamProcessor.cs > "$baseline_dir/src/Dhmp.Server/DHMPFixedStreamProcessor.cs"
      - name: Validate and build both variants
        shell: bash
        run: |
          set -euo pipefail
          for root_dir in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dhmp-carry-baseline"; do
            dotnet run --project "$root_dir/benchmarks/dotnet-receive-boundary-tests/Dhmp.ReceiveBoundary.Tests.csproj" -c Release
            dotnet build "$root_dir/benchmarks/dotnet-receive-boundary-bench/Dhmp.ReceiveBoundary.Bench.csproj" -c Release
          done
      - name: Alternate baseline and current measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p carry-results
          dotnet --info > carry-results/environment.txt
          lscpu >> carry-results/environment.txt
          git rev-parse HEAD >> carry-results/environment.txt
          echo 'baseline=213e39825174384b5c92c80066b63164231949dd TieredCompilation=0' >> carry-results/environment.txt
          for profile in receive fragmented; do
            passes=1000
            if [[ "$profile" == fragmented ]]; then passes=10; fi
            for run in 1 2 3 4 5; do
              variants=(baseline current)
              if (( run % 2 == 0 )); then variants=(current baseline); fi
              for variant in "${variants[@]}"; do
                root_dir="$GITHUB_WORKSPACE"
                if [[ "$variant" == baseline ]]; then root_dir="$RUNNER_TEMP/dhmp-carry-baseline"; fi
                dotnet "$root_dir/benchmarks/dotnet-receive-boundary-bench/bin/Release/net10.0/Dhmp.ReceiveBoundary.Bench.dll" 2000000 "$passes" "$profile" | tee "carry-results/$profile-$variant-$run.txt"
              done
            done
          done
      - name: Summarize paired measurements
        run: python3 benchmarks/summarize_carry_ab.py carry-results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-stream-carry-ab
          path: carry-results/
