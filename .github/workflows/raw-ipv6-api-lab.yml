name: Raw IPv6 API hosted rehearsal
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/raw-ipv6-api-*/**'
      - 'tools/run_raw_api_lab.py'
      - '.github/workflows/raw-ipv6-api-lab.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/raw-ipv6-api-*/**'
      - 'tools/run_raw_api_lab.py'
      - '.github/workflows/raw-ipv6-api-lab.yml'
permissions:
  contents: read
jobs:
  raw-api-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build actual API app and ephemeral test fixture
        run: |
          dotnet build benchmarks/raw-ipv6-api-app/Dhmp.RawIpv6ApiApp.csproj -c Release
          dotnet build benchmarks/raw-ipv6-api-fixture/Dhmp.RawIpv6ApiFixture.csproj -c Release
      - name: Install packet capture tool
        run: sudo apt-get update && sudo apt-get install -y tcpdump iproute2
      - name: Run two-namespace raw IPv6 API rehearsal
        shell: bash
        run: |
          set -euo pipefail
          sudo env GITHUB_SHA="$GITHUB_SHA" python3 tools/run_raw_api_lab.py \
            --dotnet "$(command -v dotnet)" \
            --sample benchmarks/raw-ipv6-api-app/bin/Release/net10.0/Dhmp.RawIpv6ApiApp.dll \
            --fixture benchmarks/raw-ipv6-api-fixture/bin/Release/net10.0/Dhmp.RawIpv6ApiFixture.dll \
            --output "$RUNNER_TEMP/dhmp-api-evidence"
      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-api-rehearsal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dhmp-api-evidence/report.json
            ${{ runner.temp }}/dhmp-api-evidence/*.log
            ${{ runner.temp }}/dhmp-api-evidence/traffic.pcap
          if-no-files-found: warn
          retention-days: 14
