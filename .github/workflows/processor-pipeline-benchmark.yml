name: DHMP Stream Processor Optimization Benchmark
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: dhmp-stream-processor-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build native stream processor benchmark
        run: gcc -O3 -march=native -std=c11 -Wall -Wextra -Werror benchmarks/native-gen2/stream_processor_optimization.c -o /tmp/dhmp-stream
      - name: Run protocol-only processor search
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          echo "benchmark=dhmp-stream-processor-only profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES package_bytes=32"
          echo "scope=byte-stream-to-DHMP-package-observation,no-dotnet,no-models,no-workers,no-callbacks"
          echo "target=measure-real-processor-ceiling;50GBps-is-a-target-not-an-assumption"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          for ((i=1;i<=RUNS;i++)); do echo "===== RUN $i / $RUNS ====="; /tmp/dhmp-stream "$MESSAGES"; done
          echo "===== END BENCHMARK ====="
