name: Processor Pipeline Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]

permissions:
  contents: read

concurrency:
  group: processor-pipeline-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile native exchange benchmark
        working-directory: benchmarks/native-gen2
        run: gcc -O3 -march=native -pthread processor_pipeline_exchange_ab.c -o pipeline-ab

      - name: Build .NET model boundary benchmark
        run: dotnet build benchmarks/dotnet-model-boundary/Dhmp.ModelBoundary.Bench.csproj -c Release

      - name: Run focused boundary benchmark
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          : > processor-pipeline-results.txt
          echo "profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES" | tee -a processor-pipeline-results.txt
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' | tee -a processor-pipeline-results.txt || true
          dotnet --info | head -20 | tee -a processor-pipeline-results.txt

          for ((i=1; i<=RUNS; i++)); do
            {
              echo "===== RUN $i / $RUNS ====="
              benchmarks/native-gen2/pipeline-ab direct "$MESSAGES"
              benchmarks/native-gen2/pipeline-ab slab "$MESSAGES" 512
              dotnet run --project benchmarks/dotnet-model-boundary/Dhmp.ModelBoundary.Bench.csproj -c Release --no-build -- "$MESSAGES"
            } | tee -a processor-pipeline-results.txt
          done

          native=$(grep '^mode=direct ' processor-pipeline-results.txt | sed -n 's/.*checksum=\([0-9]*\).*/\1/p' | sort -u)
          slab=$(grep '^mode=slab ' processor-pipeline-results.txt | sed -n 's/.*checksum=\([0-9]*\).*/\1/p' | sort -u)
          managed=$(grep '^mode=dotnet-' processor-pipeline-results.txt | sed -n 's/.*checksum=\([0-9]*\).*/\1/p' | sort -u)
          [[ -n "$native" && "$native" == "$slab" && "$native" == "$managed" ]] || { echo "::error::Checksum mismatch"; exit 1; }
          echo "Checksum validation passed: $native"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processor-model-boundary-${{ inputs.profile }}-${{ github.run_id }}
          path: processor-pipeline-results.txt
          if-no-files-found: warn
          retention-days: 7
