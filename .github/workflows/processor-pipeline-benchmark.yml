name: Processor Pipeline Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: processor-pipeline-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile benchmark
        working-directory: benchmarks/native-gen2
        run: gcc -O3 -march=native -pthread processor_pipeline_exchange_ab.c -o pipeline-ab

      - name: Run benchmark
        working-directory: benchmarks/native-gen2
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.profile }}" == "full" ]]; then
            RUNS=7
            MESSAGES=50000000
          else
            RUNS=3
            MESSAGES=10000000
          fi

          echo "profile=${{ inputs.profile }}"
          echo "runs=$RUNS messages=$MESSAGES"
          echo "runner=$(uname -a)"
          echo "cpu:"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          echo

          : > processor-pipeline-results.txt

          for ((i=1; i<=RUNS; i++)); do
            {
              echo "===== RUN $i / $RUNS ====="
              ./pipeline-ab direct "$MESSAGES"
              ./pipeline-ab spsc "$MESSAGES"
              ./pipeline-ab batch "$MESSAGES" 384
            } | tee -a processor-pipeline-results.txt
          done

          direct_checksum=$(grep '^mode=direct ' processor-pipeline-results.txt | sed -n 's/.*checksum=\([0-9]*\).*/\1/p' | sort -u)
          spsc_checksum=$(grep '^mode=spsc ' processor-pipeline-results.txt | sed -n 's/.*checksum=\([0-9]*\).*/\1/p' | sort -u)
          batch_checksum=$(grep '^mode=batch ' processor-pipeline-results.txt | sed -n 's/.*checksum=\([0-9]*\).*/\1/p' | sort -u)

          if [[ $(echo "$direct_checksum" | wc -l) -ne 1 ||
                $(echo "$spsc_checksum" | wc -l) -ne 1 ||
                $(echo "$batch_checksum" | wc -l) -ne 1 ||
                "$direct_checksum" != "$spsc_checksum" ||
                "$direct_checksum" != "$batch_checksum" ]]; then
            echo "::error::Checksum validation failed; benchmark results are invalid."
            exit 1
          fi

          echo "Checksum validation passed: $direct_checksum"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processor-pipeline-${{ inputs.profile }}-${{ github.run_id }}
          path: benchmarks/native-gen2/processor-pipeline-results.txt
          if-no-files-found: warn
          retention-days: 7
