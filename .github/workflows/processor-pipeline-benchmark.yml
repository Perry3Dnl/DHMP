name: DHMP Direct Model Buffer Benchmark
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: dhmp-stage-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build benchmarks/dotnet-model-boundary/Dhmp.ModelBoundary.Bench.csproj -c Release
      - name: Run isolated stages on one runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          : > stage-results.txt
          echo "profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES package_bytes=32 stages=raw-read,package-model,direct-model-buffer" | tee -a stage-results.txt
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' | tee -a stage-results.txt || true
          for stage in raw-read package-model direct-model-buffer; do
            echo "===== STAGE $stage =====" | tee -a stage-results.txt
            for ((i=1;i<=RUNS;i++)); do
              echo "----- RUN $i / $RUNS -----" | tee -a stage-results.txt
              dotnet benchmarks/dotnet-model-boundary/bin/Release/net10.0/Dhmp.ModelBoundary.Bench.dll "$stage" "$MESSAGES" | tee -a stage-results.txt
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dhmp-direct-model-buffer-${{ github.run_id }}
          path: stage-results.txt
          retention-days: 7
