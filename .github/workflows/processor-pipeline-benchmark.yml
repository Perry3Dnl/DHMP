name: DHMP Producer Slab Worker Pipeline Benchmark
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: dhmp-stage-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build once
        run: dotnet build benchmarks/dotnet-model-boundary/Dhmp.ModelBoundary.Bench.csproj -c Release
      - name: Run producer slab worker pipeline
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          STAGES=(baseline-read direct-cast pipeline-1w pipeline-2w pipeline-4w)
          echo "benchmark=producer-slab-workers profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES package_bytes=32 slab_size=512 slab_slots=64 checksum=A+D"
          echo "metrics=end_to_end_mps,producer_stalls,producer_stall_ms,producer_stall_pct,max_depth_slabs,consumed,checksum"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          for stage in "${STAGES[@]}"; do
            echo "===== STAGE $stage ====="
            for ((i=1;i<=RUNS;i++)); do
              echo "----- RUN $i / $RUNS -----"
              dotnet benchmarks/dotnet-model-boundary/bin/Release/net10.0/Dhmp.ModelBoundary.Bench.dll "$stage" "$MESSAGES"
            done
          done
          echo "===== END BENCHMARK ====="
