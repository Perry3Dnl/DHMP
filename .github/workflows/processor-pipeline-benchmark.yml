name: DHMP Fixed A-B-C-D Model Pipeline Benchmark
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: dhmp-stage-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build once
        run: dotnet build benchmarks/dotnet-model-boundary/Dhmp.ModelBoundary.Bench.csproj -c Release
      - name: Run fixed A-B-C-D comparison on one runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          STAGES=(baseline-read direct-cast cast-copy-model-buffer direct-write-model-buffer)
          : > stage-results.txt
          echo "benchmark=fixed-abcd profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES package_bytes=32 checksum=A+D" | tee -a stage-results.txt
          echo "rules=same-runner,same-input-shape,same-message-count,same-checksum,separate-process-per-stage,allocations-outside-timer" | tee -a stage-results.txt
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' | tee -a stage-results.txt || true
          for stage in "${STAGES[@]}"; do
            echo "===== STAGE $stage =====" | tee -a stage-results.txt
            for ((i=1;i<=RUNS;i++)); do
              echo "----- RUN $i / $RUNS -----" | tee -a stage-results.txt
              dotnet benchmarks/dotnet-model-boundary/bin/Release/net10.0/Dhmp.ModelBoundary.Bench.dll "$stage" "$MESSAGES" | tee -a stage-results.txt
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dhmp-fixed-abcd-${{ github.run_id }}
          path: stage-results.txt
          retention-days: 7
