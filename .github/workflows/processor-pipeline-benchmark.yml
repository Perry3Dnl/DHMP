name: DHMP .NET Boundary Cost Ladder
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: dhmp-dotnet-boundary-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build .NET boundary benchmark
        run: dotnet build benchmarks/dotnet-model-boundary/Dhmp.ModelBoundary.Bench.csproj -c Release
      - name: Run .NET boundary cost ladder
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          echo "benchmark=dhmp-dotnet-boundary profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES package_bytes=32 span_packages=512"
          echo "L0=accept DHMP package spans; no payload copy"
          echo "L1=zero-copy package->C# model view + consume"
          echo "L2=zero-copy model view + batch4 consume"
          echo "L3=explicit copy into model buffer + consume (cost reference, not preferred architecture)"
          echo "L4=Latest: consume newest C# model per incoming span"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          DLL=benchmarks/dotnet-model-boundary/bin/Release/net10.0/Dhmp.ModelBoundary.Bench.dll
          STAGES=(span-accept model-view model-view-batch4 copy-models latest)
          for stage in "${STAGES[@]}"; do
            echo "===== STAGE $stage ====="
            for ((i=1;i<=RUNS;i++)); do echo "----- RUN $i / $RUNS -----"; dotnet "$DLL" "$stage" "$MESSAGES"; done
          done
          echo "===== END BENCHMARK ====="
