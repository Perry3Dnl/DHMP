name: DHMP .NET Transition A-B Benchmark
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: dhmp-dotnet-transition-ab
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build benchmarks/dotnet-model-boundary/Dhmp.ModelBoundary.Bench.csproj -c Release
      - name: Run fair A-B transition benchmark
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=10000000; PASSES=100; else RUNS=3; MESSAGES=10000000; PASSES=25; fi
          echo "benchmark=dhmp-dotnet-transition-ab profile=${{ inputs.profile }} runs=$RUNS messages_per_pass=$MESSAGES passes=$PASSES package_bytes=32 span_packages=512"
          echo "B0=Sequential baseline: typed span + identical observer, no lease"
          echo "B1=Sequential: exact B0 path + bounded region acquire/release"
          echo "B2=Latest baseline: typed span + newest-item observer, no lease"
          echo "B3=Latest: exact B2 path + bounded region acquire/release"
          echo "REF=application field consumption; OUT OF SCOPE"
          echo "ownership overhead is B1-B0 and B3-B2; compare ns_span within each pair"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          DLL=benchmarks/dotnet-model-boundary/bin/Release/net10.0/Dhmp.ModelBoundary.Bench.dll
          for stage in seq-base seq-lease latest-base latest-lease app-reference; do
            echo "===== STAGE $stage ====="
            for ((i=1;i<=RUNS;i++)); do dotnet "$DLL" "$stage" "$MESSAGES" "$PASSES"; done
          done
          echo "===== END BENCHMARK ====="
