name: Processor Pipeline Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: processor-pipeline-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile benchmark
        working-directory: benchmarks/native-gen2
        run: gcc -O3 -march=native -pthread processor_pipeline_exchange_ab.c -o pipeline-ab

      - name: Run benchmark
        working-directory: benchmarks/native-gen2
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          echo "profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          : > processor-pipeline-results.txt

          for ((i=1; i<=RUNS; i++)); do
            {
              echo "===== RUN $i / $RUNS ====="
              ./pipeline-ab direct "$MESSAGES"
              ./pipeline-ab spsc "$MESSAGES"
              for slab in 32 128 384 512; do
                ./pipeline-ab slab "$MESSAGES" "$slab"
              done
            } | tee -a processor-pipeline-results.txt
          done

          expected=$(grep '^mode=direct ' processor-pipeline-results.txt | sed -n 's/.*checksum=\([0-9]*\).*/\1/p' | sort -u)
          [[ $(echo "$expected" | wc -l) -eq 1 ]] || { echo "::error::Direct checksum inconsistent"; exit 1; }

          all=$(sed -n 's/.*checksum=\([0-9]*\).*/\1/p' processor-pipeline-results.txt | sort -u)
          [[ $(echo "$all" | wc -l) -eq 1 && "$all" == "$expected" ]] || { echo "::error::Checksum validation failed; results invalid"; exit 1; }
          echo "Checksum validation passed: $expected"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processor-pipeline-${{ inputs.profile }}-${{ github.run_id }}
          path: benchmarks/native-gen2/processor-pipeline-results.txt
          if-no-files-found: warn
          retention-days: 7
