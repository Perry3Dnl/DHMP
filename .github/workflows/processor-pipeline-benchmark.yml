name: DHMP SPSC Slab Pipeline Benchmark
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: dhmp-stage-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build once
        run: dotnet build benchmarks/dotnet-model-boundary/Dhmp.ModelBoundary.Bench.csproj -c Release
      - name: Run SPSC slab pipeline
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          STAGES=(baseline-read direct-cast spsc-1w spsc-2w spsc-4w)
          echo "benchmark=spsc-slab-workers profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES package_bytes=32 slab_size=512 ring_slots_per_worker=32 checksum=A+D"
          echo "design=one-independent-SPSC-slab-ring-per-worker,no-shared-claim-counter,no-per-message-sync"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          for stage in "${STAGES[@]}"; do
            echo "===== STAGE $stage ====="
            for ((i=1;i<=RUNS;i++)); do echo "----- RUN $i / $RUNS -----"; dotnet benchmarks/dotnet-model-boundary/bin/Release/net10.0/Dhmp.ModelBoundary.Bench.dll "$stage" "$MESSAGES"; done
          done
          echo "===== END BENCHMARK ====="
