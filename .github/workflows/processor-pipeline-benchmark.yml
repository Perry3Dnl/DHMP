name: DHMP Stream Framing Benchmark
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: dhmp-stream-processor-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build native DHMP framing benchmark
        run: gcc -O3 -march=native -std=c11 -Wall -Wextra -Werror benchmarks/native-gen2/stream_processor_optimization.c -o /tmp/dhmp-stream
      - name: Run protocol-only framing benchmark
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          echo "benchmark=dhmp-stream-framing profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES package_bytes=32"
          echo "scope=fixed-frame-boundaries+partial-carry+span-publication"
          echo "excluded=payload-read,checksum,deserialization,.NET,models,workers,callbacks"
          echo "sequential=publish contiguous package spans; latest=publish newest complete package per recv chunk"
          echo "fragmented pattern deliberately crosses 32-byte boundaries"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket|Flags' || true
          for ((i=1;i<=RUNS;i++)); do echo "===== RUN $i / $RUNS ====="; /tmp/dhmp-stream "$MESSAGES"; done
          echo "===== END BENCHMARK ====="
