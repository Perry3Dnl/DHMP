name: DHMP .NET Transition Benchmark
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: dhmp-dotnet-transition-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build benchmarks/dotnet-model-boundary/Dhmp.ModelBoundary.Bench.csproj -c Release
      - name: Run transition benchmark
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "full" ]]; then RUNS=7; MESSAGES=50000000; else RUNS=3; MESSAGES=10000000; fi
          echo "benchmark=dhmp-dotnet-transition profile=${{ inputs.profile }} runs=$RUNS messages=$MESSAGES package_bytes=32 span_packages=512"
          echo "scope=DHMP span -> typed zero-copy .NET view + bounded region lease/release"
          echo "B0=typed span boundary only"
          echo "B1=Sequential bounded receive-region acquire/view/release"
          echo "B2=Latest bounded receive-region acquire/newest-view/release"
          echo "REF=application field consumption; OUT OF SCOPE, comparison only"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          DLL=benchmarks/dotnet-model-boundary/bin/Release/net10.0/Dhmp.ModelBoundary.Bench.dll
          for stage in typed-boundary sequential-lease latest-lease app-reference; do
            echo "===== STAGE $stage ====="
            for ((i=1;i<=RUNS;i++)); do dotnet "$DLL" "$stage" "$MESSAGES"; done
          done
