name: Connected raw sender validation
on:
  pull_request:
    paths:
      - 'src/DHMP.RawIpv6/**'
      - 'tests/DHMP.ConnectedSendCheck/**'
      - '.github/workflows/connected-send-check.yml'
  push:
    branches: [main]
    paths:
      - 'src/DHMP.RawIpv6/**'
      - 'tests/DHMP.ConnectedSendCheck/**'
      - '.github/workflows/connected-send-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build complete sender comparison and lifecycle checks
        run: dotnet build tests/DHMP.ConnectedSendCheck/DHMP.ConnectedSendCheck.csproj -c Release
      - name: Configure raw IPv6 labs
        run: |
          sudo sysctl -w net.core.rmem_max=33554432 net.core.wmem_max=33554432
          sudo ip netns add dhmp-connected-loop
          sudo ip -n dhmp-connected-loop link set lo up
          sudo ip -n dhmp-connected-loop -6 addr add fd00::1/128 dev lo nodad
          sudo ip -n dhmp-connected-loop -6 addr add fd00::2/128 dev lo nodad
          sudo ip netns add dhmp-connected-src
          sudo ip netns add dhmp-connected-dst
          sudo ip link add dhmp-tx type veth peer name dhmp-rx
          sudo ip link set dhmp-tx netns dhmp-connected-src
          sudo ip link set dhmp-rx netns dhmp-connected-dst
          sudo ip -n dhmp-connected-src link set lo up
          sudo ip -n dhmp-connected-dst link set lo up
          sudo ip -n dhmp-connected-src link set dhmp-tx up
          sudo ip -n dhmp-connected-dst link set dhmp-rx up
          sudo ip -n dhmp-connected-src -6 addr add fd01::2/64 dev dhmp-tx nodad
          sudo ip -n dhmp-connected-dst -6 addr add fd01::1/64 dev dhmp-rx nodad
          sudo ip netns exec dhmp-connected-src ping -6 -c 1 -W 2 fd01::1
      - name: Validate contracts and measure complete senders in three fresh processes
        run: |
          for trial in 1 2 3; do
            sudo ip netns exec dhmp-connected-loop "$(command -v dotnet)" tests/DHMP.ConnectedSendCheck/bin/Release/net10.0/DHMP.ConnectedSendCheck.dll loopback
          done
      - name: Validate actual MTU rejection and recovery
        run: |
          sudo ip -n dhmp-connected-src link set dhmp-tx mtu 1280
          sudo ip -n dhmp-connected-dst link set dhmp-rx mtu 1280
          sudo ip netns exec dhmp-connected-src "$(command -v dotnet)" tests/DHMP.ConnectedSendCheck/bin/Release/net10.0/DHMP.ConnectedSendCheck.dll mtu
      - name: Force pending sends and validate cancellation and disposal
        run: |
          sudo ip netns exec dhmp-connected-src tc qdisc add dev dhmp-tx root netem delay 15000ms limit 10000
          sudo ip netns exec dhmp-connected-src "$(command -v dotnet)" tests/DHMP.ConnectedSendCheck/bin/Release/net10.0/DHMP.ConnectedSendCheck.dll pressure
      - name: Remove namespaces
        if: always()
        run: |
          sudo ip netns del dhmp-connected-loop || true
          sudo ip netns del dhmp-connected-src || true
          sudo ip netns del dhmp-connected-dst || true
