name: DHMP Mock IPv6 Framing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/mock-ipv6-framing/**'
      - '.github/workflows/mock-ipv6-framing.yml'
permissions: { contents: read }
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Environment
        run: |
          echo "COMMIT=${GITHUB_SHA}"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
      - name: Build
        run: dotnet build benchmarks/mock-ipv6-framing/Dhmp.MockIpv6Framing.csproj -c Release
      - name: Benchmark
        run: |
          echo "MOCK_IPV6_CONTRACT=V1 -- sanity run: 40-byte IPv6 header build/parse in memory; DHMP data next-header 253; control 254 stays off data path; no kernel/socket/NIC"
          DLL=benchmarks/mock-ipv6-framing/bin/Release/net10.0/Dhmp.MockIpv6Framing.dll
          for i in 1 2 3 4 5; do
            echo "===== MOCK IPV6 RUN $i / 5 ====="
            dotnet "$DLL" 100000000
          done
