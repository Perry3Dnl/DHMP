name: Unity package preview

on:
  push:
    branches: [main, 'codex/unity-networking-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile .NET Standard 2.1 runtime and test reference-codec interoperability
        run: dotnet run --project tests/DHMP.Unity.Tests/DHMP.Unity.Tests.csproj --configuration Release
      - name: Package layout, GUIDs, sample and forbidden-transport checks
        run: python tools/check_unity_package.py
      - name: Build standalone host and independently bundled host project
        run: |
          dotnet build samples/DHMP.UnityArenaHost/DHMP.UnityArenaHost.csproj -c Debug
          dotnet build "Packages/com.dhmp.networking/Samples~/DemoArena/Hosting/DHMP.UnityArenaHost~/DHMP.UnityArenaHost.csproj" -c Release
      - name: Exercise real Linux raw IPv6 sockets
        if: runner.os == 'Linux'
        shell: bash
        run: sudo "$(command -v dotnet)" tests/DHMP.Unity.Tests/bin/Release/net10.0/DHMP.Unity.Tests.dll --raw-smoke
      - name: Exercise real Windows raw IPv6 sockets
        if: runner.os == 'Windows'
        run: dotnet tests/DHMP.Unity.Tests/bin/Release/net10.0/DHMP.Unity.Tests.dll --raw-smoke
      - name: Connect two standalone processes on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: sudo python3 tools/test_unity_host.py "$(command -v dotnet)"
      - name: Connect two standalone processes on Windows
        if: runner.os == 'Windows'
        run: python tools/test_unity_host.py
      - name: Build importable archive including demo and hosting files
        if: runner.os == 'Linux'
        run: python3 tools/package_unity.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: dhmp-unity-preview
          path: artifacts/unity/*.tgz

  # Unity Editor/Mono and IL2CPP player validation require an installed, licensed Unity 6 editor.
  # The portable-runtime job is deliberately not labelled a Unity compilation/player test.
