name: DHMP Mock IP Ceiling
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/mock-ip-ceiling/**'
      - '.github/workflows/mock-ip-ceiling.yml'
permissions: { contents: read }
jobs:
  mock-ip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Environment
        run: |
          echo "COMMIT=${GITHUB_SHA}"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
      - name: Build
        run: dotnet build benchmarks/mock-ip-ceiling/Dhmp.MockIpCeiling.csproj -c Release
      - name: Benchmark
        run: |
          echo "MOCK_IP_CONTRACT=V1 -- in-memory packet boundary, fixed 32-byte DHMP messages, Latest consumes newest complete message"
          DLL=benchmarks/mock-ip-ceiling/bin/Release/net10.0/Dhmp.MockIpCeiling.dll
          for i in 1 2 3 4 5; do
            echo "===== MOCK IP RUN $i / 5 ====="
            dotnet "$DLL" 100000000
          done
