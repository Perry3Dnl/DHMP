name: Direct-IP core and licensing tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce direct-IP project boundaries
        run: python3 tools/check_architecture.py

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: [DHMP.Protocol.Tests, DHMP.Licensing.Tests, DHMP.AspNetCore.Tests, DHMP.RawIpv6.Tests, DHMP.Security.Tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test packet contracts and startup gates
        run: dotnet test tests/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release --logger "console;verbosity=normal"

  build-packet-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build direct-IP .NET backend
        run: dotnet build src/DHMP.RawIpv6/DHMP.RawIpv6.csproj --configuration Release
      - name: Build direct-IP experiments
        shell: bash
        run: |
          set -euo pipefail
          for project in benchmarks/*/*.csproj; do
            dotnet build "$project" --configuration Release
          done
