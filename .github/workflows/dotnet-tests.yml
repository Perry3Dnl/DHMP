name: .NET tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensing-tests:
    name: Licensing happy / critical / blocked paths
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/DHMP.Licensing.Tests/DHMP.Licensing.Tests.csproj

      - name: Build
        run: dotnet build tests/DHMP.Licensing.Tests/DHMP.Licensing.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/DHMP.Licensing.Tests/DHMP.Licensing.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
