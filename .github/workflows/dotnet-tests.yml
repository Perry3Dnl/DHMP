name: .NET tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensing-tests:
    name: Licensing unit + startup integration paths
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore licensing tests
        run: dotnet restore tests/DHMP.Licensing.Tests/DHMP.Licensing.Tests.csproj

      - name: Restore ASP.NET integration tests
        run: dotnet restore tests/DHMP.AspNetCore.Tests/DHMP.AspNetCore.Tests.csproj

      - name: Build licensing tests
        run: dotnet build tests/DHMP.Licensing.Tests/DHMP.Licensing.Tests.csproj --configuration Release --no-restore

      - name: Build ASP.NET integration tests
        run: dotnet build tests/DHMP.AspNetCore.Tests/DHMP.AspNetCore.Tests.csproj --configuration Release --no-restore

      - name: Test licensing unit paths
        run: dotnet test tests/DHMP.Licensing.Tests/DHMP.Licensing.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Test ASP.NET startup paths
        run: dotnet test tests/DHMP.AspNetCore.Tests/DHMP.AspNetCore.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
