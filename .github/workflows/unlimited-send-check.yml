name: Unlimited send performance check
on:
  pull_request:
    paths:
      - 'src/DHMP.Client/**'
      - 'benchmarks/unlimited-send-check/**'
      - '.github/workflows/unlimited-send-check.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compare production fast path with historical async path
        run: dotnet run --project benchmarks/unlimited-send-check/DHMP.UnlimitedSendCheck.csproj --configuration Release
